name: workflow

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    name: Build Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - name: Build and tag image
        run: docker build -t team5-backend:${{ github.sha }} -t team5-backend:latest .
      - name: Confirm image tags
        run: docker images team5-backend --format '{{.Repository}}:{{.Tag}} {{.ID}} {{.Size}}'
