services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: team5
      POSTGRES_USER: team5
      POSTGRES_PASSWORD: team5
    ports:
      - "5433:5432"
    volumes:
      - team5-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U team5 -d team5"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  team5-postgres-data: